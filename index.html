<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEDSPORT - Record Fix 9.4</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; touch-action: none; }
        
        .super-container { 
            display: grid; 
            grid-template-columns: 260px 1fr 260px; 
            grid-template-rows: 50px 1fr 90px;
            width: 98vw; height: 96vh; gap: 10px; padding: 10px; box-sizing: border-box; 
        }

        header { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; }
        header h1 { color: #00ffff; letter-spacing: 4px; font-size: 1.8rem; margin: 0; text-shadow: 0 0 10px #00ffff; opacity: 0.8; }

        .panel { display: flex; flex-direction: column; gap: 6px; justify-content: center; }

        .item-card { 
            display: grid; grid-template-columns: 45px 1fr; grid-template-rows: 20px 14px; 
            align-items: center; gap: 0 10px; padding: 10px 12px; background: #0c0c0c; border-radius: 15px; border: 2px solid #222; 
            cursor: pointer; transition: 0.2s; position: relative;
        }
        
        .item-card.active { border-color: #00ffff; box-shadow: 0 0 12px rgba(0,255,255,0.4); background: #001515; }
        .item-card.motion-item.active { border-color: #ff00ff; box-shadow: 0 0 12px rgba(255,0,255,0.4); background: #150015; }

        .item-emoji { grid-row: 1 / -1; font-size: 2rem; text-align: center; }
        .item-name { font-weight: 800; font-size: 0.85rem; text-transform: uppercase; color: #aaa; }
        .active .item-name { color: #fff; }

        /* ШКАЛА С МАРКЕРОМ РЕКОРДА */
        .progress-bar-container { grid-column: 2; height: 6px; background: #1a1a1a; border-radius: 3px; position: relative; overflow: visible; margin-top: 4px; }
        .progress-bar-fill { position: absolute; height: 100%; top: 0; left: 0; background: #00ffff; width: 0%; border-radius: 3px; transition: width 0.1s linear; z-index: 1; }
        .motion-item .progress-bar-fill { background: #ff00ff; }
        
        /* ТОТ САМЫЙ МАРКЕР РЕКОРДА */
        .record-marker { 
            position: absolute; width: 3px; height: 14px; background: #fff; 
            top: -4px; left: 0%; transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 2; box-shadow: 0 0 8px #fff; border-radius: 2px;
        }

        #video-container { 
            grid-column: 2; grid-row: 2; display: flex; justify-content: center; align-items: center; 
            position: relative; background: #000; border-radius: 25px; overflow: hidden; border: 3px solid #1a1a1a; 
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        footer { grid-column: 1 / -1; grid-row: 3; display: grid; grid-template-columns: 1fr 180px 1fr; align-items: center; }
        
        .sys-btn { background: transparent; padding: 12px; border-radius: 30px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; transition: 0.2s; }
        .reset-btn { border: 2px solid #ff4444; color: #ff4444; width: 220px; }
        .reset-btn:active { background: #ff4444; color: #fff; }
        .full-btn { border: 2px solid #444; color: #666; justify-self: end; width: 140px; }

        #score-frame { 
            grid-column: 2; display: flex; justify-content: center; align-items: center; 
            height: 70px; background: #000; border: 3px solid #00ffff; border-radius: 18px; 
            box-shadow: 0 0 15px rgba(0,255,255,0.3); 
        }
        #main-score { font-size: 3.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px #00ffff; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; }
    </style>
</head>
<body>

<div id="loader"><p style="color:#00ffff; letter-spacing:2px;">ЗАГРУЗКА РЕКОРД-СИСТЕМЫ...</p></div>

<div class="super-container" id="main-container" style="display: none;">
    <header><h1>MEDSPORT</h1></header>

    <aside class="panel">
        <div class="item-card" id="card-happy" onclick="setTarget('happy')">
            <div class="item-emoji">😊</div><div class="item-name">Радость</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-happy"></div>
                <div class="record-marker" id="mark-happy"></div>
            </div>
        </div>
        <div class="item-card" id="card-sad" onclick="setTarget('sad')">
            <div class="item-emoji">☹️</div><div class="item-name">Грусть</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-sad"></div>
                <div class="record-marker" id="mark-sad"></div>
            </div>
        </div>
        <div class="item-card" id="card-surprised" onclick="setTarget('surprised')">
            <div class="item-emoji">😲</div><div class="item-name">Удивление</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-surprised"></div>
                <div class="record-marker" id="mark-surprised"></div>
            </div>
        </div>
        <div class="item-card" id="card-angry" onclick="setTarget('angry')">
            <div class="item-emoji">😠</div><div class="item-name">Гнев</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-angry"></div>
                <div class="record-marker" id="mark-angry"></div>
            </div>
        </div>
    </aside>

    <div id="video-container"><video id="video" autoplay muted playsinline></video></div>

    <aside class="panel">
        <div class="item-card motion-item" id="card-no" onclick="setTarget('no')">
            <div class="item-emoji">↔️</div><div class="item-name">Нет</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-no"></div>
                <div class="record-marker" id="mark-no"></div>
            </div>
        </div>
        <div class="item-card motion-item" id="card-yes" onclick="setTarget('yes')">
            <div class="item-emoji">↕️</div><div class="item-name">Да</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-yes"></div>
                <div class="record-marker" id="mark-yes"></div>
            </div>
        </div>
        <div class="item-card motion-item" id="card-roll" onclick="setTarget('roll')">
            <div class="item-emoji">🔄</div><div class="item-name">Вращение</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="fill-roll"></div>
                <div class="record-marker" id="mark-roll"></div>
            </div>
        </div>
    </aside>

    <footer>
        <button class="sys-btn reset-btn" onclick="resetAll()">СБРОСИТЬ РЕКОРДЫ</button>
        <div id="score-frame"><div id="main-score">0%</div></div>
        <button class="sys-btn full-btn" onclick="toggleFullScreen()">FULLSCREEN</button>
    </footer>
</div>

<script>
    let targetEmotion = null;
    let aiInitialized = false;
    let offsets = { yaw: 0, pitch: 0, roll: 0 };
    let isCalibrating = true;
    let records = { happy: 0, sad: 0, surprised: 0, angry: 0, no: 0, yes: 0, roll: 0 };
    const GOLDEN_SENS = 0.02;

    window.onload = async () => { await initAI(); };

    async function initAI() {
        try {
            const URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
            const video = document.getElementById('video');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                aiInitialized = true;
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-container').style.display = 'grid';
                startAnalysis();
            };
        } catch (err) { alert("Ошибка камеры"); }
    }

    function resetAll() {
        // Сбрасываем рекорды в ноль
        records = { happy: 0, sad: 0, surprised: 0, angry: 0, no: 0, yes: 0, roll: 0 };
        Object.keys(records).forEach(id => {
            const marker = document.getElementById(`mark-${id}`);
            if(marker) marker.style.left = '0%';
        });
        isCalibrating = true; // Перекалибровка текущей позы
        document.getElementById('main-score').innerText = '0%';
    }

    function setTarget(id) {
        targetEmotion = id;
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`card-${id}`).classList.add('active');
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    function startAnalysis() {
        const video = document.getElementById('video');
        setInterval(async () => {
            if (!aiInitialized) return;
            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }))
                .withFaceLandmarks().withFaceExpressions();
            
            if (detections && detections.length > 0) {
                const land = detections[0].landmarks;
                const nose = land.getNose();
                const jaw = land.getJawOutline();
                const lEye = land.getLeftEye();
                const rEye = land.getRightEye();

                const rYaw = (nose[0].x - (jaw[0].x + jaw[16].x)/2);
                const rPitch = (nose[3].y - (lEye[0].y + rEye[3].y)/2);
                const rRoll = (lEye[0].y - rEye[3].y);

                if (isCalibrating) {
                    offsets = { yaw: rYaw, pitch: rPitch, roll: rRoll };
                    isCalibrating = false;
                }

                const motions = {
                    'no': Math.abs(rYaw - offsets.yaw) * GOLDEN_SENS,
                    'yes': Math.abs(rPitch - offsets.pitch) * GOLDEN_SENS,
                    'roll': Math.abs(rRoll - offsets.roll) * GOLDEN_SENS
                };

                const expr = detections[0].expressions;

                ['happy', 'sad', 'surprised', 'angry', 'no', 'yes', 'roll'].forEach(id => {
                    let val = (['no', 'yes', 'roll'].includes(id)) ? motions[id] : expr[id];
                    const deadZone = 0.08; 
                    val = (val < deadZone) ? 0 : (val - deadZone) / (1 - deadZone);
                    let result = Math.min(100, Math.round(val * 100));

                    // Текущая полоска
                    const fill = document.getElementById(`fill-${id}`);
                    if(fill) fill.style.width = result + '%';

                    // МАРКЕР РЕКОРДА
                    if (result > records[id]) {
                        records[id] = result;
                        const marker = document.getElementById(`mark-${id}`);
                        if(marker) marker.style.left = result + '%';
                    }

                    if (id === targetEmotion) {
                        const disp = document.getElementById('main-score');
                        disp.innerText = result + '%';
                        disp.style.color = `hsl(${180 + result}, 100%, 70%)`;
                    }
                });
            }
        }, 50);
    }
</script>
</body>
</html>
