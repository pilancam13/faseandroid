<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>MEDSPORT - Super UI 9.3</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        /* БАЗОВЫЕ СТИЛИ - ТЕМНАЯ ТЕМА И НЕОНОВЫЙ АКЦЕНТ */
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; touch-action: none; }
        
        /* ГЛАВНЫЙ КОНТЕЙНЕР - ГОРИЗОНТАЛЬНАЯ СЕТКА КАК НА СКРИНШОТЕ */
        .super-container { 
            display: grid; 
            grid-template-columns: 280px 1fr 280px; 
            grid-template-rows: 60px 1fr 100px;
            width: 95vw; height: 95vh; max-width: 1200px; gap: 10px; padding: 10px; box-sizing: border-box; 
        }

        /* ЗАГОЛОВОК */
        header { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid #222; }
        header h1 { color: #00ffff; letter-spacing: 5px; font-size: 2rem; margin: 0; text-shadow: 0 0 10px #00ffff; }

        /* ВЫДЕЛЕННЫЕ БЛОКИ ПО БОКАМ */
        .panel { display: flex; flex-direction: column; gap: 8px; justify-content: center; padding: 10px; background: rgba(20,20,20,0.5); border-radius: 20px; border: 1px solid #333; }

        /* СТИЛИЗАЦИЯ КАРТОЧЕК (ЭМОЦИИ И ДВИЖЕНИЯ) */
        .item-card { 
            display: grid; grid-template-columns: 50px 1fr; grid-template-rows: 24px 16px; 
            align-items: center; gap: x 10px; padding: 8px 15px; background: #111; border-radius: 15px; border: 2px solid #222; 
            cursor: pointer; transition: 0.2s; position: relative;
        }
        
        /* ЭФФЕКТ АКТИВАЦИИ (НЕОНОВОЕ СВЕЧЕНИЕ) */
        .item-card.active { border-color: #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.7); background: #001a1a; }
        .item-card.motion-item.active { border-color: #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.7); background: #1a001a; }

        /* ИКОНКИ И ТЕКСТ */
        .item-emoji { grid-row: 1 / -1; font-size: 2.2rem; text-align: center; }
        .item-name { font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #ccc; }
        .active .item-name { color: #fff; }

        /* ГОРИЗОНТАЛЬНЫЙ ПРОГРЕСС-БАР КАК НА СКРИНШОТЕ */
        .progress-bar-container { grid-column: 2; height: 8px; background: #222; border-radius: 4px; overflow: hidden; position: relative; }
        .progress-bar-fill { position: absolute; height: 100%; top: 0; left: 0; background: #00ffff; width: 0%; transition: width 0.1s linear; }
        .motion-item .progress-bar-fill { background: #ff00ff; }
        .active .progress-bar-fill { box-shadow: 0 0 10px #00ffff; }
        .motion-item.active .progress-bar-fill { box-shadow: 0 0 10px #ff00ff; }

        /* ВИДЕО (КОМПАКТНОЕ И В ЦЕНТРЕ) */
        #video-container { 
            grid-column: 2; grid-row: 2; display: flex; justify-content: center; align-items: center; 
            position: relative; background: #000; border-radius: 30px; overflow: hidden; border: 4px solid #222; 
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* НИЖНЯЯ ПАНЕЛЬ С БАЛЛОМ */
        footer { grid-column: 1 / -1; grid-row: 3; display: grid; grid-template-columns: 1fr 200px 1fr; align-items: center; gap: 20px; }
        
        /* КНОПКИ ДЛЯ МОБИЛЬНЫХ */
        .sys-btn { background: transparent; padding: 10px 20px; border-radius: 30px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; transition: 0.2s; }
        .reset-btn { border: 2px solid #ff4444; color: #ff4444; }
        .reset-btn:active { background: #ff4444; color: #fff; }
        .full-btn { border: 2px solid #444; color: #888; grid-column: 3; justify-self: end; }

        /* ГЛАВНЫЙ СЧЕТЧИК БАЛЛОВ В СВЕТЯЩЕЙСЯ РАМКЕ */
        #score-frame { 
            grid-column: 2; display: flex; justify-content: center; align-items: center; 
            height: 80px; background: #000; border: 3px solid #00ffff; border-radius: 20px; 
            box-shadow: 0 0 20px rgba(0,255,255,0.5); 
        }
        #main-score { font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffff; letter-spacing: -3px; }

        /* ЛОАДЕР И ОШИБКИ */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; }
        #loader p { font-weight: 900; color: #00ffff; letter-spacing: 3px; font-size: 1.2rem; text-shadow: 0 0 10px #00ffff; }
    </style>
</head>
<body>

<div id="loader"><p>ИНИЦИАЛИЗАЦИЯ СУПЕР UI...</p></div>

<div class="super-container" id="main-container" style="display: none;">
    <header><h1>MEDSPORT</h1></header>

    <aside class="panel">
        <div class="item-card" id="card-happy" onclick="setTarget('happy')">
            <div class="item-emoji">😊</div><div class="item-name">Радость</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-happy"></div></div>
        </div>
        <div class="item-card" id="card-sad" onclick="setTarget('sad')">
            <div class="item-emoji">☹️</div><div class="item-name">Грусть</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-sad"></div></div>
        </div>
        <div class="item-card" id="card-surprised" onclick="setTarget('surprised')">
            <div class="item-emoji">😲</div><div class="item-name">Удивление</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-surprised"></div></div>
        </div>
        <div class="item-card" id="card-angry" onclick="setTarget('angry')">
            <div class="item-emoji">😠</div><div class="item-name">Гнев</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-angry"></div></div>
        </div>
    </aside>

    <div id="video-container"><video id="video" autoplay muted playsinline></video></div>

    <aside class="panel">
        <div class="item-card motion-item" id="card-no" onclick="setTarget('no')">
            <div class="item-emoji">↔️</div><div class="item-name">Нет</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-no"></div></div>
        </div>
        <div class="item-card motion-item" id="card-yes" onclick="setTarget('yes')">
            <div class="item-emoji">↕️</div><div class="item-name">Да</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-yes"></div></div>
        </div>
        <div class="item-card motion-item" id="card-roll" onclick="setTarget('roll')">
            <div class="item-emoji">🔄</div><div class="item-name">Вращение</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="fill-roll"></div></div>
        </div>
    </aside>

    <footer>
        <button class="sys-btn reset-btn" onclick="resetAll()">СБРОС И КАЛИБРОВКА</button>
        <div id="score-frame"><div id="main-score">0%</div></div>
        <button class="sys-btn full-btn" onclick="toggleFullScreen()">FULLSCREEN</button>
    </footer>
</div>

<script>
    // ПАРАМЕТРЫ И ФЛАГИ
    let targetEmotion = null;
    let aiInitialized = false;
    let offsets = { yaw: 0, pitch: 0, roll: 0 };
    let isCalibrating = true;
    const GOLDEN_SENS = 0.02; // Ваше эталонное значение

    // АВТОМАТИЧЕСКИЙ ЗАПУСК (БЕЗ ВЫБОРА ЯЗЫКА)
    window.onload = async () => {
        document.getElementById('loader').style.display = 'flex';
        await initAI();
    };

    // ИНИЦИАЛИЗАЦИЯ НЕЙРОСЕТИ И КАМЕРЫ (АДАПТИРОВАНО ДЛЯ ANDROID)
    async function initAI() {
        try {
            const URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceExpressionNet.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);

            const video = document.getElementById('video');
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                aiInitialized = true;
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-container').style.display = 'grid';
                startAnalysis();
            };
        } catch (err) {
            alert("ОШИБКА: Доступ к камере запрещен или заблокирован другим приложением. Используйте HTTPS в Chrome на Android.");
            document.getElementById('loader').innerHTML = "<p style='color:red; text-shadow: 0 0 10px red;'>ОШИБКА КАМЕРЫ</p>";
        }
    }

    // СБРОС И КАЛИБРОВКА НУЛЯ
    function resetAll() {
        isCalibrating = true;
        document.getElementById('main-score').innerText = '0%';
        document.getElementById('main-score').style.color = '#fff';
    }

    // ВЫБОР ЦЕЛИ УПРАЖНЕНИЯ
    function setTarget(id) {
        targetEmotion = id;
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`card-${id}`).classList.add('active');
    }

    // ПОЛНОЭКРАННЫЙ РЕЖИМ (КРИТИЧНО ДЛЯ МОБИЛЬНЫХ)
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Ошибка перехода в Fullscreen: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // ЦИКЛ АНАЛИЗА (30 РАЗ В СЕКУНДУ)
    function startAnalysis() {
        const video = document.getElementById('video');
        setInterval(async () => {
            if (!aiInitialized) return;

            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }))
                .withFaceLandmarks().withFaceExpressions();
            
            if (detections && detections.length > 0) {
                const land = detections[0].landmarks;
                const nose = land.getNose();
                const jaw = land.getJawOutline();
                const lEye = land.getLeftEye();
                const rEye = land.getRightEye();

                const rYaw = (nose[0].x - (jaw[0].x + jaw[16].x)/2);
                const rPitch = (nose[3].y - (lEye[0].y + rEye[3].y)/2);
                const rRoll = (lEye[0].y - rEye[3].y);

                // КАЛИБРОВКА НУЛЕВОЙ ТОЧКИ
                if (isCalibrating) {
                    offsets = { yaw: rYaw, pitch: rPitch, roll: rRoll };
                    isCalibrating = false;
                }

                // РАСЧЕТ ДВИЖЕНИЙ С ЭТАЛОННОЙ ЧУВСТВИТЕЛЬНОСТЬЮ 0.02
                const motions = {
                    'no': Math.abs(rYaw - offsets.yaw) * GOLDEN_SENS,
                    'yes': Math.abs(rPitch - offsets.pitch) * GOLDEN_SENS,
                    'roll': Math.abs(rRoll - offsets.roll) * GOLDEN_SENS
                };

                const expr = detections[0].expressions;

                // ОБНОВЛЕНИЕ ШКАЛ И СЧЕТЧИКА
                ['happy', 'sad', 'surprised', 'angry', 'no', 'yes', 'roll'].forEach(id => {
                    let val = (['no', 'yes', 'roll'].includes(id)) ? motions[id] : expr[id];
                    
                    const deadZone = 0.08; 
                    if (val < deadZone) val = 0;
                    else val = (val - deadZone) / (1 - deadZone);

                    let result = Math.min(100, Math.round(val * 100));

                    // Обновляем горизонтальный прогресс-бар
                    const fill = document.getElementById(`fill-${id}`);
                    if(fill) fill.style.width = result + '%';

                    // Обновляем главный неоновый счетчик внизу
                    if (id === targetEmotion) {
                        const disp = document.getElementById('main-score');
                        disp.innerText = result + '%';
                        // Плавное изменение цвета неона от голубого к зеленому
                        disp.style.textShadow = `0 0 15px hsl(${180 + result * 1.2}, 100%, 50%)`;
                        document.getElementById('score-frame').style.borderColor = `hsl(${180 + result * 1.2}, 100%, 50%)`;
                    }
                });
            }
        }, 33); // Частота обновления 30 FPS
    }
</script>
</body>
</html>
